<!doctype html>
<!-- data-theme/data-mode are stamped again by screens-account.js before the
     first paint; these are what the very first frame uses. -->
<html lang="en-IN" data-theme="sky" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patel Marketing — Wholesale Kitchenware</title>
<meta name="description" content="Wholesale kitchenware from Patel Marketing, Hubli. Cast iron, non-stick, stainless steel and hotelware, with trade rates and an order pad for dealers.">

<!-- V4. The catalogue as a shop rather than a list, and since build 40
     this IS the site.

     Screens are routes, so the phone's Back button and the edge-swipe
     gesture walk the route the reader actually took. That is the whole
     reason this version exists: on V3 a customer opened a shared product
     link, pressed Back, and the browser closed, because the product was
     an overlay and had never been a history entry at all.

     The previous build is archived at /v3/ and still works. It reads the
     same data.json, images, config.js and supabase-auth.js from here, so
     there is one copy of each to keep current. See ARCHITECTURE.md. -->

<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patel Marketing">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<meta property="og:type" content="website">
<meta property="og:title" content="Patel Marketing — Wholesale Kitchenware">
<meta property="og:description" content="The whole range, with trade rates and an order pad.">
<meta property="og:image" content="og-banner.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=41">

<style>
/* Printing. The order form is the one thing anyone prints, and the
   browser's own "save as PDF" is on every phone already — a 300KB
   library to produce one page is not a trade worth making. */
#printsheet{display:none}
@media print{
  .topbar,.tabbar,.cartbar,.sheet,.sheet-scrim,.toast,main{display:none!important}
  #printsheet{display:block;font-family:var(--sans);color:#000;padding:0}
  #printsheet h1{font-size:17pt;margin-bottom:4pt}
  #printsheet .pmeta{font-size:9pt;line-height:1.5;margin-bottom:12pt}
  #printsheet table{width:100%;border-collapse:collapse;font-size:8.5pt}
  #printsheet th{text-align:left;border-bottom:1.2pt solid #000;padding:4pt 3pt;font-size:8pt;
    text-transform:uppercase;letter-spacing:.04em}
  #printsheet td{border-bottom:.4pt solid #bbb;padding:4pt 3pt;vertical-align:top}
  #printsheet td small{color:#555;font-size:7.5pt}
  #printsheet .num{text-align:right;font-variant-numeric:tabular-nums}
  #printsheet tfoot td{border-top:1.2pt solid #000;border-bottom:0;font-weight:800;
    text-align:right;padding-top:6pt}
  #printsheet .foot{margin-top:14pt;font-size:8pt;color:#444;line-height:1.5}
  @page{margin:14mm}
}
/* The first paint, before core.js has the catalogue. Shown for the few
   hundred milliseconds data.json takes, so the app never opens blank. */
#boot{padding:80px 20px;text-align:center;color:var(--ink-2)}
#boot .brandmark{margin:0 auto 14px;width:46px;height:46px;font-size:1rem}
</style>
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="brandmark">PM</div>
      <div class="brandname grow">Patel Marketing<small>Wholesale Kitchenware</small></div>
    </div>
  </header>

  <main>
    <div id="view">
      <div id="boot">
        <div class="brandmark">PM</div>
        <p>Loading the catalogue…</p>
      </div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<div id="printsheet" aria-hidden="true"></div>

<noscript>
  <div style="padding:24px;text-align:center">
    <h1 style="font-size:1.1rem">This catalogue needs JavaScript</h1>
    <p style="margin-top:8px;font-size:.85rem">Please turn it on, or message us on WhatsApp
      and we will send you what you need.</p>
  </div>
</noscript>

<script src="config.js?v=41"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-auth.js?v=41"></script>
<script src="core.js?v=41"></script>
<script src="ui.js?v=41"></script>
<script src="screens-browse.js?v=41"></script>
<script src="screens-order.js?v=41"></script>
<script src="screens-account.js?v=41"></script>
<script src="app.js?v=41"></script>
</body>
</html>
