<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="Patel Marketing — Wholesale Kitchenware">
  <defs>
    <linearGradient id="pmSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E5871"/>
      <stop offset="1" stop-color="#1B2833"/>
    </linearGradient>
    <linearGradient id="pmBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0AE5E"/>
      <stop offset="0.55" stop-color="#B07A2B"/>
      <stop offset="1" stop-color="#8A5C1B"/>
    </linearGradient>
  </defs>

  <!-- badge: a pan seen from above, handle to the right -->
  <g>
    <rect x="10" y="18" width="104" height="104" rx="26" fill="url(#pmSteel)"/>
    <!-- handle -->
    <rect x="104" y="61" width="34" height="18" rx="9" fill="url(#pmBrass)"/>
    <!-- rim -->
    <circle cx="62" cy="70" r="38" fill="none" stroke="url(#pmBrass)" stroke-width="3.5" opacity="0.85"/>
    <!-- monogram -->
    <path d="M44 47 h20 a17 17 0 0 1 0 34 h-9 v12 h-11 z m11 11 v12 h9 a6 6 0 0 0 0-12 z"
          fill="#FFFFFF"/>
    <path d="M74 93 v-30 l9 15 9-15 v30 h-6 v-15 l-3 6 -3-6 v15 z" fill="#E7C68C"/>
  </g>

  <!-- wordmark -->
  <g fill="#16202A">
    <text x="158" y="70" font-family="Archivo, 'Arial Black', Helvetica, sans-serif"
          font-size="44" font-weight="800" letter-spacing="-1.6">PATEL</text>
    <text x="158" y="105" font-family="Archivo, Helvetica, sans-serif"
          font-size="29" font-weight="600" letter-spacing="4.6" fill="#4E6E8E">MARKETING</text>
  </g>
  <rect x="158" y="82" width="186" height="2" fill="#B07A2B"/>
  <text x="352" y="105" font-family="'IBM Plex Mono', ui-monospace, monospace"
        font-size="11" letter-spacing="1.4" fill="#6C7F90">WHOLESALE · KITCHENWARE</text>
</svg>
